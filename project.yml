# XcodeGen project definition. Run `xcodegen generate` to create VolumeRocker.xcodeproj.
# The .xcodeproj is generated and git-ignored; edit this file instead.
name: VolumeRocker

options:
  bundleIdPrefix: io.github.printmoney
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Apple Silicon only
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are ad-hoc signed. Release builds are re-signed with Developer ID by Scripts/ and CI.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Localization (String Catalogs)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Needed so the SwiftLint build phase can read the source files
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VolumeRocker:
    type: application
    platform: macOS
    sources:
      - path: VolumeRocker
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Volume Rocker
        PRODUCT_MODULE_NAME: VolumeRocker
        PRODUCT_BUNDLE_IDENTIFIER: io.github.printmoney.VolumeRocker
        INFOPLIST_FILE: VolumeRocker/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd "$SRCROOT"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "note: SwiftLint is not installed; skipping lint (brew install swiftlint)"
          fi

  VolumeRockerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VolumeRockerTests
    dependencies:
      - target: VolumeRocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.printmoney.VolumeRockerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Volume Rocker.app/Contents/MacOS/Volume Rocker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VolumeRocker:
    build:
      targets:
        VolumeRocker: all
        VolumeRockerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VolumeRockerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
