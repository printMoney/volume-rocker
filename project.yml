# XcodeGen project definition. Run `xcodegen generate` to create VolumeRocker.xcodeproj.
# The .xcodeproj is generated and git-ignored; edit this file instead.
name: VolumeRocker

options:
  bundleIdPrefix: io.github.printmoney
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  configs:
    # Hardened runtime only where it's needed (notarized releases). Locally signed builds can't use it,
    # because it requires every embedded framework to come from the same developer team.
    Release:
      ENABLE_HARDENED_RUNTIME: YES
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Zero warnings policy for our own code (packages keep their own settings).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Apple Silicon only
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
    # Local builds are ad-hoc signed. Release builds are re-signed with Developer ID by Scripts/ and CI.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Localization (String Catalogs)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Needed so the SwiftLint build phase can read the source files
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # Exact versions keep builds reproducible. Update deliberately and note it in CHANGELOG.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  VolumeRocker:
    type: application
    platform: macOS
    sources:
      - path: VolumeRocker
        excludes:
          - "**/*.md"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Volume Rocker
        PRODUCT_MODULE_NAME: VolumeRocker
        PRODUCT_BUNDLE_IDENTIFIER: io.github.printmoney.VolumeRocker
        INFOPLIST_FILE: VolumeRocker/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Sparkle
      - package: KeyboardShortcuts
      - target: VolumeRockerControls
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd "$SRCROOT"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "note: SwiftLint is not installed; skipping lint (brew install swiftlint)"
          fi

  VolumeRockerControls:
    # Control Center / menu bar controls (WidgetKit), macOS 26 and later.
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VolumeRockerControls
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: VolumeRockerControls
        PRODUCT_BUNDLE_IDENTIFIER: io.github.printmoney.VolumeRocker.Controls
        INFOPLIST_FILE: VolumeRockerControls/Info.plist
        CODE_SIGN_ENTITLEMENTS: VolumeRockerControls/VolumeRockerControls.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: YES

  VolumeRockerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VolumeRockerTests
    dependencies:
      - target: VolumeRocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.printmoney.VolumeRockerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Volume Rocker.app/Contents/MacOS/Volume Rocker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VolumeRocker:
    build:
      targets:
        VolumeRocker: all
        VolumeRockerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VolumeRockerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
