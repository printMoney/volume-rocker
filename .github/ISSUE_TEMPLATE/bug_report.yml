name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Volume Rocker
        2. Play music in …
        3. …
  - type: input
    id: version
    attributes:
      label: Volume Rocker version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Air M3
  - type: textarea
    id: devices
    attributes:
      label: Audio devices and apps involved
      placeholder: e.g. AirPods Pro, Spotify, Safari
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Console.app → filter by "Volume Rocker".
