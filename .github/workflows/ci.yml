name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # Always the latest versions, so CI uses the same formatting rules as a freshly set-up Mac.
        run: |
          brew update --quiet
          brew install swiftlint swiftformat
          brew upgrade swiftlint swiftformat || true
          swiftformat --version && swiftlint version
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test (Apple Silicon)
    runs-on: macos-26 # arm64 runner
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project VolumeRocker.xcodeproj \
            -scheme VolumeRocker \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
